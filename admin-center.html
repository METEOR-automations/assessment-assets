<style>
:root{--blue:#0f6cbd;--blue-d:#0c5aa0;--blue-l:#ebf3fc;--text:#242424;--muted:#616161;--line:#e0e0e0;--bg:#faf9f8;--nav:#f3f2f1;--white:#fff;--red:#c50f1f;--green:#107c10;--amber:#bc4b09}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
button{font:inherit;color:inherit}
.top{position:fixed;top:0;left:0;right:0;height:48px;background:#1b1a19;color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;z-index:30}
.top .app{font-weight:600;font-size:15px}
.top .tenant{opacity:.85;font-size:13px;border-left:1px solid #555;padding-left:12px}
.top .clock{margin-left:auto;font-size:13px;opacity:.9}
.menu{display:none;background:none;border:0;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px}
.app-shell{display:flex;padding-top:48px;min-height:100%}
nav{width:232px;flex:none;background:var(--nav);border-right:1px solid var(--line);padding:12px 0;position:fixed;top:48px;bottom:0;overflow-y:auto}
nav .sec{font-size:12px;color:var(--muted);font-weight:600;padding:14px 20px 6px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 20px 8px 28px;cursor:pointer;font-size:14px;border-left:3px solid transparent}
nav button:hover{background:#e8e6e4}
nav button.on{background:#fff;border-left-color:var(--blue);font-weight:600}
main{flex:1;margin-left:232px;padding:24px 32px 48px;min-width:0}
h1{font-size:24px;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.bar input,.bar select{font:inherit;padding:6px 10px;border:1px solid #c8c6c4;border-radius:4px;background:#fff;min-width:220px}
.bar .count{color:var(--muted);font-size:13px;margin-left:auto}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{font-weight:600;font-size:13px;color:var(--muted);background:#fff;position:sticky;top:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--blue-l)}
tbody tr:focus{outline:2px solid var(--blue);outline-offset:-2px}
td.wrap{white-space:normal;min-width:260px}
.link{color:var(--blue)}
.st{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.ok .dot{background:var(--green)}.bad .dot{background:var(--red)}.int .dot{background:var(--amber)}.off .dot{background:#8a8886}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.card h2{font-size:16px;margin:0 0 12px}
.nums{display:flex;gap:28px;margin:6px 0 12px}
.nums div span{display:block;font-size:22px;font-weight:600}
.nums div small{color:var(--muted)}
.card p{margin:0 0 14px;color:var(--muted);line-height:1.45}
.btn{background:#fff;border:1px solid #8a8886;border-radius:4px;padding:6px 14px;cursor:pointer}
.btn:hover{background:#f3f2f1}
h2.sh{font-size:18px;font-weight:600;margin:28px 0 10px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:#fff;z-index:50;box-shadow:-8px 0 24px rgba(0,0,0,.18);display:none;flex-direction:column}
.panel.open,.scrim.open{display:flex}
.ph{padding:20px 24px 0;border-bottom:1px solid var(--line)}
.ph .x{float:right;background:none;border:0;font-size:22px;cursor:pointer;line-height:1;padding:2px 6px}
.ph h2{font-size:20px;margin:0 0 2px}
.ph .meta{color:var(--muted);margin:0 0 14px}
.tabs{display:flex;flex-wrap:wrap;gap:0 4px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;white-space:nowrap}
.tabs button.on{border-bottom-color:var(--blue);font-weight:600}
.pb{padding:20px 24px;overflow-y:auto;flex:1}
dl{display:grid;grid-template-columns:200px 1fr;gap:10px 16px;margin:0}
dt{color:var(--muted)}dd{margin:0}
.pb h3{font-size:14px;margin:22px 0 8px}
.pb h3:first-child{margin-top:0}
.pb table th,.pb table td{padding:8px 10px}
.empty{color:var(--muted)}
.note{background:#f3f2f1;border-radius:4px;padding:10px 12px;margin:0 0 16px;color:var(--text)}
@media (max-width:820px){
 .menu{display:block}
 nav{transform:translateX(-100%);transition:transform .2s;z-index:35;box-shadow:4px 0 16px rgba(0,0,0,.15)}
 nav.show{transform:none}
 main{margin-left:0;padding:20px 16px 40px}
 .top .tenant{display:none}
 dl{grid-template-columns:1fr;gap:2px 0}dd{margin-bottom:10px}
 .bar input,.bar select{min-width:0;flex:1}
}
@media (prefers-reduced-motion:reduce){nav{transition:none}}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm = u => D.names[u] || u;
const mail = u => u + "@hartwellcpa.com";
const byUser = {}; D.users.forEach(u => byUser[u.user] = u);
const groupsOf = u => D.groups.filter(g => g.members.includes(u));
const ownedBy = u => D.groups.filter(g => g.owners.includes(u)).map(g => g.name);
const mbxOf = u => D.mailboxes.filter(m => m.fullaccess.includes(u) || m.sendas.includes(u)).map(m => {
  const p = []; if (m.fullaccess.includes(u)) p.push("Full Access"); if (m.sendas.includes(u)) p.push("Send As");
  return [m.name, m.email, p.join(", ")]; });
const assigned = lic => D.users.filter(u => u.license === lic);
let view = "users";

function setView(v, push = true){
  if (push && v !== view) { try { history.pushState({view: v}, ""); } catch (err) {} }
  view = v;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  $("#nav").classList.remove("show");
  closePanel();
  render(); window.scrollTo(0,0);
}
function render(){ ({users:vUsers, groups:vGroups, mailboxes:vMbx, licenses:vLic, signins:vSign, security:vSec})[view](); }

function rowsClickable(sel, fn){
  document.querySelectorAll(sel).forEach(tr => {
    tr.tabIndex = 0;
    tr.addEventListener("click", () => fn(tr.dataset.k));
    tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(tr.dataset.k); } });
  });
}
function status(s){
  const cls = s === "Success" || s === "Sign-in allowed" ? "ok" : s === "Failure" ? "bad" : s === "Interrupted" ? "int" : "off";
  return `<span class="st ${cls}"><span class="dot"></span>${esc(s)}</span>`;
}

/* ---------- Active users ---------- */
let uq = "", uf = "all";
function vUsers(){
  $("#main").innerHTML = `<h1>Active users</h1><p class="sub">Accounts in the Hartwell &amp; Associates tenant.</p>
  <div class="bar"><input id="uq" type="search" placeholder="Search by name or username" value="${esc(uq)}" aria-label="Search users">
  <select id="uf" aria-label="Filter users">
   <option value="all">All users</option><option value="licensed">Licensed users</option>
   <option value="unlicensed">Unlicensed users</option><option value="blocked">Sign-in blocked</option></select>
  <span class="count" id="uc"></span></div>
  <div class="tw"><table><thead><tr><th>Display name</th><th>Username</th><th>Title</th><th>Department</th><th>Licenses</th><th>Sign-in status</th></tr></thead><tbody id="ub"></tbody></table></div>`;
  $("#uf").value = uf;
  const draw = () => {
    const q = uq.toLowerCase();
    const list = D.users.filter(u => (!q || u.name.toLowerCase().includes(q) || mail(u.user).includes(q)) &&
      (uf === "all" || (uf === "licensed" && u.license) || (uf === "unlicensed" && !u.license) || (uf === "blocked" && u.status === "Sign-in blocked")));
    $("#ub").innerHTML = list.map(u => `<tr class="click" data-k="${u.user}"><td class="link">${esc(u.name)}</td><td>${mail(u.user)}</td><td>${esc(u.title)}</td><td>${esc(u.dept)}</td><td>${esc(u.license || "Unlicensed")}</td><td>${status(u.status)}</td></tr>`).join("") ||
      `<tr><td colspan="6" class="empty">No users match this search.</td></tr>`;
    $("#uc").textContent = list.length + " of " + D.users.length + " accounts";
    rowsClickable("#ub tr.click", openUser);
  };
  $("#uq").addEventListener("input", e => { uq = e.target.value; draw(); });
  $("#uf").addEventListener("change", e => { uf = e.target.value; draw(); });
  draw();
}
function openUser(k){
  const u = byUser[k];
  const tabs = u.kind === "Shared mailbox" ? ["Account","Mailbox permissions"] : ["Account","Groups and roles","Mailbox permissions","Authentication methods","Activity"];
  openPanel(u.name, mail(u.user), tabs, t => {
    if (t === "Account") {
      const rows = [["Account type", u.kind], ["Sign-in status", status(u.status)]];
      if (u.kind === "User") rows.push(["Title", esc(u.title)], ["Department", esc(u.dept)], ["Manager", u.manager ? esc(nm(u.manager)) : "None"], ["Office", esc(u.office)]);
      rows.push(["Licenses", esc(u.license || "Unlicensed")], ["Last successful sign-in", esc(u.lastSuccess)]);
      if (u.kind === "User") rows.push(["Last password change", esc(u.pwChange)]);
      rows.push(["Created", esc(u.created)]);
      return (u.kind === "Shared mailbox" ? `<p class="note">This account belongs to a shared mailbox. People open it through the permissions listed under Mailbox permissions.</p>` : "") +
        `<dl>${rows.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join("")}</dl>`;
    }
    if (t === "Groups and roles") {
      const g = groupsOf(u.user), own = ownedBy(u.user);
      return `<h3>Groups</h3>` + (g.length ? `<div class="tw"><table><thead><tr><th>Group</th><th>Type</th><th>Owner</th></tr></thead><tbody>${g.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td>${own.includes(x.name) ? "Yes" : "No"}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">Not a member of any group.</p>`) +
        `<h3>Admin roles</h3>` + (u.roles.length ? `<p>${u.roles.map(esc).join(", ")}</p>` : `<p class="empty">No admin roles assigned.</p>`);
    }
    if (t === "Mailbox permissions") {
      if (u.kind === "Shared mailbox") {
        const m = D.mailboxes.find(x => x.user === u.user);
        return mbxPerms(m);
      }
      const m = mbxOf(u.user);
      return m.length ? `<div class="tw"><table><thead><tr><th>Shared mailbox</th><th>Email</th><th>Permissions</th></tr></thead><tbody>${m.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">No permissions on shared mailboxes.</p>`;
    }
    if (t === "Authentication methods") {
      return u.methods.length ? `<div class="tw"><table><thead><tr><th>Method</th><th>Device</th><th>Registered</th></tr></thead><tbody>${u.methods.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">No authentication methods registered.</p>`;
    }
    if (t === "Activity") {
      return u.activity.length ? `<div class="tw"><table><thead><tr><th>When</th><th>Activity</th><th>By</th></tr></thead><tbody>${u.activity.map(r => `<tr><td>${esc(r[0])}</td><td class="wrap">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">No recent activity.</p>`;
    }
  });
}

/* ---------- Groups ---------- */
let gq = "";
function vGroups(){
  $("#main").innerHTML = `<h1>Groups</h1><p class="sub">Distribution lists, teams, and security groups.</p>
  <div class="bar"><input id="gq" type="search" placeholder="Search groups" value="${esc(gq)}" aria-label="Search groups"><span class="count" id="gc"></span></div>
  <div class="tw"><table><thead><tr><th>Group name</th><th>Type</th><th>Email</th><th>Members</th><th>Description</th></tr></thead><tbody id="gb"></tbody></table></div>`;
  const draw = () => {
    const q = gq.toLowerCase();
    const list = D.groups.filter(g => !q || g.name.toLowerCase().includes(q));
    $("#gb").innerHTML = list.map(g => `<tr class="click" data-k="${esc(g.name)}"><td class="link">${esc(g.name)}</td><td>${esc(g.type)}</td><td>${esc(g.email || "None")}</td><td>${g.members.length}</td><td class="wrap">${esc(g.desc)}</td></tr>`).join("") ||
      `<tr><td colspan="5" class="empty">No groups match this search.</td></tr>`;
    $("#gc").textContent = list.length + " groups";
    rowsClickable("#gb tr.click", openGroup);
  };
  $("#gq").addEventListener("input", e => { gq = e.target.value; draw(); });
  draw();
}
function openGroup(k){
  const g = D.groups.find(x => x.name === k);
  openPanel(g.name, g.type + (g.email ? " · " + g.email : ""), ["General","Members"], t => {
    if (t === "General") return `<dl><dt>Type</dt><dd>${esc(g.type)}</dd><dt>Email</dt><dd>${esc(g.email || "None")}</dd><dt>Description</dt><dd>${esc(g.desc)}</dd><dt>Owners</dt><dd>${g.owners.map(nm).map(esc).join(", ")}</dd><dt>Members</dt><dd>${g.members.length}</dd></dl>`;
    return `<div class="tw"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th></tr></thead><tbody>${g.members.map(m => `<tr><td>${esc(nm(m))}</td><td>${mail(m)}</td><td>${g.owners.includes(m) ? "Owner" : "Member"}</td></tr>`).join("")}</tbody></table></div>`;
  });
}

/* ---------- Shared mailboxes ---------- */
function mbxPerms(m){
  return `<h3>Full Access</h3><p class="empty" style="margin-top:-4px">Can open the mailbox and read and manage its email.</p>` +
   (m.fullaccess.length ? `<div class="tw"><table><thead><tr><th>Name</th><th>Username</th></tr></thead><tbody>${m.fullaccess.map(u => `<tr><td>${esc(nm(u))}</td><td>${mail(u)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">No one has this permission.</p>`) +
   `<h3>Send As</h3><p class="empty" style="margin-top:-4px">Can send email that appears to come from the mailbox.</p>` +
   (m.sendas.length ? `<div class="tw"><table><thead><tr><th>Name</th><th>Username</th></tr></thead><tbody>${m.sendas.map(u => `<tr><td>${esc(nm(u))}</td><td>${mail(u)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">No one has this permission.</p>`);
}
function vMbx(){
  $("#main").innerHTML = `<h1>Shared mailboxes</h1><p class="sub">Mailboxes that several people open from their own accounts.</p>
  <div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Full Access</th><th>Send As</th><th>Description</th></tr></thead><tbody id="mb">${D.mailboxes.map(m => `<tr class="click" data-k="${m.user}"><td class="link">${esc(m.name)}</td><td>${m.email}</td><td>${m.fullaccess.length}</td><td>${m.sendas.length}</td><td class="wrap">${esc(m.desc)}</td></tr>`).join("")}</tbody></table></div>`;
  rowsClickable("#mb tr.click", k => { const m = D.mailboxes.find(x => x.user === k); openPanel(m.name, m.email, ["Permissions","General"], t => t === "General" ? `<dl><dt>Email</dt><dd>${m.email}</dd><dt>Description</dt><dd>${esc(m.desc)}</dd><dt>Sign-in</dt><dd>Blocked (shared mailbox)</dd><dt>License</dt><dd>Unlicensed</dd></dl>` : mbxPerms(m)); });
}

/* ---------- Licenses ---------- */
function vLic(){
  $("#main").innerHTML = `<h1>Licenses</h1><p class="sub">Products purchased for this tenant and who they are assigned to.</p><div class="cards">` +
   D.licenses.map((l,i) => { const a = assigned(l.name).length; return `<section class="card"><h2>${esc(l.name)}</h2>
    <div class="nums"><div><span>${l.total}</span><small>Total</small></div><div><span>${a}</span><small>Assigned</small></div><div><span>${l.total - a}</span><small>Available</small></div></div>
    <p>Includes: ${esc(l.includes)}</p><button class="btn" data-l="${i}">View assigned users</button></section>`; }).join("") + `</div>`;
  document.querySelectorAll("[data-l]").forEach(b => b.addEventListener("click", () => {
    const l = D.licenses[+b.dataset.l], a = assigned(l.name);
    openPanel(l.name, a.length + " of " + l.total + " assigned", ["Assigned users"], () =>
      a.length ? `<div class="tw"><table><thead><tr><th>Name</th><th>Username</th><th>Department</th></tr></thead><tbody>${a.map(u => `<tr><td>${esc(u.name)}</td><td>${mail(u.user)}</td><td>${esc(u.dept)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">No users are assigned this license.</p>`);
  }));
}

/* ---------- Sign-in logs ---------- */
let sq = "", sf = "all";
function vSign(){
  $("#main").innerHTML = `<h1>Sign-in logs</h1><p class="sub">Interactive sign-ins from the last 7 days.</p>
  <div class="bar"><input id="sq" type="search" placeholder="Search by user or application" value="${esc(sq)}" aria-label="Search sign-ins">
  <select id="sf" aria-label="Filter by status"><option value="all">All statuses</option><option>Success</option><option>Failure</option><option>Interrupted</option></select>
  <span class="count" id="sc"></span></div>
  <div class="tw"><table><thead><tr><th>Date</th><th>User</th><th>Application</th><th>Status</th><th>IP address</th><th>Location</th></tr></thead><tbody id="sb"></tbody></table></div>`;
  $("#sf").value = sf;
  const draw = () => {
    const q = sq.toLowerCase();
    const list = D.events.filter(e => (!q || nm(e.u).toLowerCase().includes(q) || mail(e.u).includes(q) || e.app.toLowerCase().includes(q)) && (sf === "all" || e.status === sf));
    $("#sb").innerHTML = list.map(e => `<tr class="click" data-k="${e.id}"><td>${e.when}</td><td class="link">${esc(nm(e.u))}</td><td>${esc(e.app)}</td><td>${status(e.status)}</td><td>${e.ip}</td><td>${esc(e.loc)}</td></tr>`).join("") ||
      `<tr><td colspan="6" class="empty">No sign-ins match this search.</td></tr>`;
    $("#sc").textContent = list.length + " sign-ins";
    rowsClickable("#sb tr.click", openEvent);
  };
  $("#sq").addEventListener("input", e => { sq = e.target.value; draw(); });
  $("#sf").addEventListener("change", e => { sf = e.target.value; draw(); });
  draw();
}
function openEvent(k){
  const e = D.events.find(x => x.id === k);
  openPanel("Sign-in details", e.when + " · " + nm(e.u), ["Basic info","Authentication details","Conditional Access","Device info"], t => {
    if (t === "Basic info") return `<dl><dt>Date</dt><dd>${e.when}</dd><dt>User</dt><dd>${esc(nm(e.u))}</dd><dt>Username</dt><dd>${mail(e.u)}</dd><dt>Application</dt><dd>${esc(e.app)}</dd><dt>Status</dt><dd>${status(e.status)}</dd>` +
      (e.code ? `<dt>Error code</dt><dd>${e.code}</dd><dt>Failure reason</dt><dd>${esc(e.reason)}</dd>` : "") + `<dt>IP address</dt><dd>${e.ip}</dd><dt>Location</dt><dd>${esc(e.loc)}</dd></dl>`;
    if (t === "Authentication details") return `<div class="tw"><table><thead><tr><th>Step</th><th>Method and result</th></tr></thead><tbody><tr><td>First factor</td><td class="wrap">${esc(e.first)}</td></tr><tr><td>Second factor</td><td class="wrap">${esc(e.second)}</td></tr></tbody></table></div>`;
    if (t === "Conditional Access") return `<div class="tw"><table><thead><tr><th>Policy</th><th>Result</th></tr></thead><tbody>${e.ca.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></div>`;
    return `<dl><dt>Operating system</dt><dd>${esc(e.os)}</dd><dt>Device name</dt><dd>${esc(e.device || "Not available")}</dd><dt>Client app</dt><dd>${esc(e.client)}</dd></dl>`;
  });
}

/* ---------- Security ---------- */
function vSec(){
  $("#main").innerHTML = `<h1>Security</h1><p class="sub">Sign-in policies and the authentication methods people can use in this tenant.</p>
  <h2 class="sh">Conditional Access policies</h2>
  <div class="tw"><table><thead><tr><th>Policy name</th><th>State</th><th>Users</th><th>Requirement</th></tr></thead><tbody id="cb">${D.security.policies.map((p,i) => `<tr class="click" data-k="${i}"><td class="link">${esc(p.name)}</td><td>${esc(p.state)}</td><td>${esc(p.users)}</td><td>${esc(p.grant)}</td></tr>`).join("")}</tbody></table></div>
  <h2 class="sh">Authentication methods</h2>
  <div class="tw"><table><thead><tr><th>Method</th><th>Status</th><th>Allowed for</th></tr></thead><tbody>${D.security.methods.map(m => `<tr><td>${esc(m[0])}</td><td><span class="st ${m[1] === "Enabled" ? "ok" : "off"}"><span class="dot"></span>${esc(m[1])}</span></td><td>${esc(m[2] || "None")}</td></tr>`).join("")}</tbody></table></div>`;
  rowsClickable("#cb tr.click", k => { const p = D.security.policies[+k];
    openPanel(p.name, "Conditional Access policy", ["Settings"], () => `<dl><dt>State</dt><dd>${esc(p.state)}</dd><dt>Users included</dt><dd>${esc(p.users)}</dd><dt>Users excluded</dt><dd>${esc(p.excluded)}</dd><dt>Target resources</dt><dd>${esc(p.resources)}</dd><dt>Conditions</dt><dd>${esc(p.conditions)}</dd><dt>Grant</dt><dd>${esc(p.grant)}</dd></dl>`); });
}

/* ---------- Panel ---------- */
let lastFocus = null;
function openPanel(title, meta, tabs, body){
  lastFocus = document.activeElement;
  $("#pTitle").textContent = title; $("#pMeta").textContent = meta;
  const show = t => { $("#pTabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.textContent === t)); $("#pBody").innerHTML = body(t); $("#pBody").scrollTop = 0; };
  $("#pTabs").innerHTML = tabs.map(t => `<button type="button">${esc(t)}</button>`).join("");
  $("#pTabs").querySelectorAll("button").forEach(b => b.addEventListener("click", () => show(b.textContent)));
  $("#pTabs").style.display = tabs.length > 1 ? "flex" : "none";
  show(tabs[0]);
  $("#panel").classList.add("open"); $("#scrim").classList.add("open");
  $("#shell").inert = true; document.querySelector(".top").inert = true;
  $("#pClose").focus();
}
function closePanel(){
  if (!$("#panel").classList.contains("open")) return;
  $("#panel").classList.remove("open"); $("#scrim").classList.remove("open");
  $("#shell").inert = false; document.querySelector(".top").inert = false;
  if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
}
$("#pClose").addEventListener("click", closePanel);
$("#scrim").addEventListener("click", closePanel);
document.addEventListener("keydown", e => {
  if (!$("#panel").classList.contains("open")) return;
  if (e.key === "Escape") { closePanel(); return; }
  if (e.key !== "Tab") return;
  const f = [...$("#panel").querySelectorAll("button, input, select, [tabindex]:not([tabindex='-1'])")].filter(el => el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (!$("#panel").contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
$("#menuBtn").addEventListener("click", () => $("#nav").classList.toggle("show"));
window.addEventListener("popstate", e => { const v = e.state && e.state.view; if (v) setView(v, false); });
try { history.replaceState({view: "users"}, ""); } catch (err) {}
render();
</script>

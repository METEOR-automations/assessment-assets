<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Home Support - Ticket queue</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23102542'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Ccircle cx='23' cy='10.5' r='3' fill='%2381B0F0'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#102542; --brand-2:#1B3A63; --orbit:#81B0F0;
  --ink:#18212E; --muted:#5E6878; --faint:#8A93A1;
  --line:#DDE2E9; --surface:#F4F6F9; --panel:#FFFFFF; --hover:#F0F3F7; --select:#E8EEF7;
  --new-bg:#E3ECFB; --new-fg:#1D4F9E; --reo-bg:#FBEFD9; --reo-fg:#875809;
  --closed-bg:#ECEFF3; --closed-fg:#4F5967;
  --focus:#2F6FDB;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#E6EBF2; --muted:#9FAABA; --faint:#7C8798;
    --line:#26334A; --surface:#0E1520; --panel:#141E2C; --hover:#18263A; --select:#1C2D47;
    --new-bg:#1A2E50; --new-fg:#A9C6F5; --reo-bg:#3A2D12; --reo-fg:#F1C77A;
    --closed-bg:#202B3B; --closed-fg:#AAB4C3;
    --focus:#7FA9EE;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Figtree",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:var(--surface);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Top bar */
.topbar{background:var(--brand);color:#fff;display:flex;align-items:center;gap:20px;padding:0 20px;height:56px;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.01em;white-space:nowrap}
.brand small{font-weight:500;opacity:.7;font-size:14px}
.search{flex:1;max-width:440px;position:relative}
.search input{width:100%;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;padding:0 12px 0 36px;font:inherit;font-size:14px}
.search input::placeholder{color:rgba(255,255,255,.65)}
.search svg{position:absolute;left:11px;top:10px;opacity:.7}
.clock{margin-left:auto;font-size:14px;opacity:.85;white-space:nowrap}
.me{width:32px;height:32px;border-radius:50%;background:var(--brand-2);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.notice{flex:none;background:var(--panel);border-bottom:1px solid var(--line);color:var(--muted);font-size:13.5px;padding:8px 20px}
.notice strong{color:var(--ink);font-weight:600}

/* Layout */
.app{flex:1;display:grid;grid-template-columns:400px 1fr;min-height:0}

.list{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.list-head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.list-head h1{font-size:18px;margin:0;font-weight:700}
.list-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.rows{overflow-y:auto;flex:1;margin:0;padding:0;list-style:none}
.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 18px 12px 15px;border-left:3px solid transparent;cursor:pointer}
.row:hover{background:var(--hover)}
.row[aria-selected="true"]{background:var(--select);border-left-color:var(--brand)}
@media (prefers-color-scheme: dark){.row[aria-selected="true"]{border-left-color:var(--orbit)}}
.row-top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.row-top .id{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.row-top .t{margin-left:auto;font-variant-numeric:tabular-nums}
.row .subj{display:block;font-weight:600;font-size:14.5px;margin:3px 0 2px;line-height:1.35}
.row .who{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;line-height:1.6}
.chip.new{background:var(--new-bg);color:var(--new-fg)}
.chip.reopened{background:var(--reo-bg);color:var(--reo-fg)}
.chip.closed{background:var(--closed-bg);color:var(--closed-fg)}
.empty{padding:40px 24px;color:var(--muted);text-align:center;font-size:14px}

/* Detail */
.detail{min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.detail-empty{margin:auto;color:var(--muted);text-align:center;padding:24px}
.detail-empty svg{opacity:.5;margin-bottom:8px}
.d-head{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 24px}
.d-nav{display:none;margin-bottom:10px}
.d-top{display:flex;align-items:flex-start;gap:16px}
.d-top>div:first-child{flex:1;min-width:0}
.back{display:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13.5px}
.pager{display:flex;gap:6px;flex:none}
.pager button{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.d-head h1{font-size:21px;line-height:1.3;margin:0 0 6px;font-weight:700}
.d-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.d-meta .id{font-weight:600;color:var(--ink)}
.d-body{flex:1;overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;padding:20px 24px 32px;align-items:start}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.msg-from{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--select);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.msg-from b{display:block;font-size:14.5px}
.msg-from span{font-size:13px;color:var(--muted)}
.msg p{margin:0 0 10px;max-width:68ch}
.msg p:last-child{margin-bottom:0}

.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{font-size:14px;margin:0 0 8px;font-weight:700}
.card dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:13.5px}
.card dt{color:var(--muted)}
.card dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:break-word;hyphens:none}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hist button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13.5px}
.hist button:hover{border-color:var(--faint)}
.hist .h1{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px}
.hist .h1 b{color:var(--ink);font-weight:600}
.hist .h2{display:block;margin-top:2px;line-height:1.35}
.none{font-size:13.5px;color:var(--muted);margin:0}

/* Previous ticket dialog */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 64px);background:var(--panel);color:var(--ink);box-shadow:0 20px 50px rgba(8,18,34,.28)}
dialog::backdrop{background:rgba(10,20,36,.45)}
.dlg-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dlg-head h2{margin:0;font-size:17px;line-height:1.35}
.dlg-head p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.close{margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13.5px;flex:none}
.dlg-body{padding:16px 20px 20px;overflow-y:auto}
.dlg-body h3{font-size:13.5px;margin:0 0 6px;color:var(--muted);font-weight:600}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 16px;font-size:14px}
.notes{margin:0;display:grid;grid-template-columns:150px 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:14px}
.notes dt,.notes dd{margin:0;padding:9px 12px;border-bottom:1px solid var(--line)}
.notes dt{background:var(--surface);color:var(--muted);font-weight:600}
.notes dt:nth-last-of-type(1),.notes dd:last-of-type{border-bottom:0}

@media (max-width:1180px){.app{grid-template-columns:340px 1fr}.d-body{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .detail{display:none}
  .app.open .list{display:none}
  .app.open .detail{display:flex}
  .d-nav{display:block}
  .back{display:inline-block}
  .clock{display:none}
  .brand small{display:none}
  .d-head,.d-body{padding-left:16px;padding-right:16px}
  .notes{grid-template-columns:1fr}
  .notes dt{border-bottom:0;padding-bottom:2px}
}
@media (prefers-reduced-motion: no-preference){.row,.hist button{transition:background-color .12s ease,border-color .12s ease}}
</style>
</head>

  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
};
const waited = m => { const d = NOW - m, h = Math.floor(d/60), r = d%60; return h ? `Waiting ${h}h ${r}m` : `Waiting ${r}m`; };
const initials = n => n.split(" ").map(p => p[0]).join("").slice(0,2);
const chip = s => el("span", {class:"chip " + s.toLowerCase()}, s);

let query = "", currentId = null;

function visible(){
  const q = query.trim().toLowerCase();
  if (!q) return TICKETS;
  return TICKETS.filter(t => [t.id,t.subject,t.customer,t.account,...t.body].join(" ").toLowerCase().includes(q));
}

function renderList(){
  const list = visible(), ul = $("#rows");
  ul.replaceChildren();
  $("#list-sub").textContent = query ? `${list.length} of 10 tickets match` : "10 open tickets, oldest first";
  if (!list.length) { ul.append(el("li", {class:"empty"}, "No tickets match your search.")); return; }
  list.forEach(t => {
    const b = el("button", {class:"row", role:"option", "aria-selected": String(t.id === currentId), "data-id": t.id, onclick: () => open(t.id)},
      el("span", {class:"row-top"}, el("span", {class:"id"}, t.id), chip(t.status), el("span", {class:"t"}, t.time)),
      el("span", {class:"subj"}, t.subject),
      el("span", {class:"who"}, el("span", {}, t.customer), el("span", {}, waited(t.min)))
    );
    b.addEventListener("keydown", e => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        const rows = [...document.querySelectorAll(".row")], i = rows.indexOf(b);
        const nxt = rows[i + (e.key === "ArrowDown" ? 1 : -1)];
        if (nxt) nxt.focus();
      }
    });
    ul.append(el("li", {}, b));
  });
}

function dl(pairs){
  const d = el("dl");
  pairs.forEach(([k,v]) => { d.append(el("dt", {}, k), el("dd", {}, v)); });
  return d;
}

function open(id){
  const t = TICKETS.find(x => x.id === id);
  if (!t) return;
  currentId = id;
  document.querySelectorAll(".row").forEach(r => r.setAttribute("aria-selected", String(r.dataset.id === id)));
  const idx = TICKETS.indexOf(t);
  const prev = el("button", {"aria-label":"Previous ticket", title:"Previous ticket (←)", onclick: () => open(TICKETS[idx-1].id)}, "‹");
  const next = el("button", {"aria-label":"Next ticket", title:"Next ticket (→)", onclick: () => open(TICKETS[idx+1].id)}, "›");
  if (idx === 0) prev.disabled = true;
  if (idx === TICKETS.length-1) next.disabled = true;

  const customer = [["Name", t.customer],["Email", t.email]];
  if (t.phone) customer.push(["Phone", t.phone]);
  customer.push(["Account", t.account]);

  const hist = t.history.length
    ? el("ul", {class:"hist"}, ...t.history.map(h => {
        const H = HISTORY[h];
        return el("li", {}, el("button", {onclick: () => showHistory(h)},
          el("span", {class:"h1"}, el("b", {}, h), el("span", {}, H.meta.replace(/^Closed by [^,]+, |^Chat, solved by [^,]+, /, ""))),
          el("span", {class:"h2"}, H.subject)));
      }))
    : el("p", {class:"none"}, "No previous tickets.");

  const head = el("div", {class:"d-head"},
    el("div", {class:"d-nav"}, el("button", {class:"back", onclick: closeDetail}, "‹ All tickets")),
    el("div", {class:"d-top"},
      el("div", {},
        el("h1", {}, t.subject),
        el("div", {class:"d-meta"}, el("span", {class:"id"}, t.id), chip(t.status), el("span", {}, `Received ${t.time} by email`), el("span", {}, waited(t.min)))),
      el("div", {class:"pager"}, prev, next))
  );
  const msg = el("article", {class:"msg"},
    el("div", {class:"msg-from"}, el("div", {class:"avatar"}, initials(t.customer)),
      el("div", {}, el("b", {}, t.customer), el("span", {}, `Today, ${t.time}`))),
    ...t.body.map(p => el("p", {}, p))
  );
  const side = el("aside", {class:"side"},
    el("section", {class:"card"}, el("h2", {}, "Customer"), dl(customer)),
    el("section", {class:"card"}, el("h2", {}, t.device.length && t.device[0][0] === "On account" ? "Devices" : "Device"), dl(t.device)),
    el("section", {class:"card"}, el("h2", {}, "Order"), dl(t.order)),
    el("section", {class:"card"}, el("h2", {}, "Previous tickets"), hist)
  );
  $("#detail").replaceChildren(head, el("div", {class:"d-body"}, msg, side));
  $("#app").classList.add("open");
  $("#detail .d-body").scrollTop = 0;
}

function closeDetail(){
  $("#app").classList.remove("open");
  const r = document.querySelector(`.row[data-id="${currentId}"]`);
  if (r) r.focus();
}

function showHistory(h){
  const H = HISTORY[h];
  $("#dlg-title").textContent = `${h}: ${H.subject}`;
  $("#dlg-sub").textContent = H.meta;
  const notes = el("dl", {class:"notes"});
  H.notes.forEach(([k,v]) => notes.append(el("dt", {}, k), el("dd", {}, v)));
  $("#dlg-body").replaceChildren(
    el("h3", {}, "Customer message"), el("p", {class:"quote"}, H.message),
    el("h3", {}, "Agent notes"), notes
  );
  $("#dlg").showModal();
}

$("#dlg-close").addEventListener("click", () => $("#dlg").close());
$("#dlg").addEventListener("click", e => { if (e.target === $("#dlg")) $("#dlg").close(); });
$("#q").addEventListener("input", e => { query = e.target.value; renderList(); });
document.addEventListener("keydown", e => {
  if ($("#dlg").open || !currentId || ["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  const i = TICKETS.findIndex(t => t.id === currentId);
  if (e.key === "ArrowRight" && i < TICKETS.length-1) open(TICKETS[i+1].id);
  if (e.key === "ArrowLeft" && i > 0) open(TICKETS[i-1].id);
});

renderList();
</script>
</body>
</html>

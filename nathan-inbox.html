<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inbox (40) - nathan@thehubfitness.com</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f8fc; --panel:#ffffff; --ink:#1f1f1f; --ink2:#5e5e5e; --line:#e3e6ec;
  --hov:#f2f6fc; --unreadbg:#ffffff; --readbg:#f2f6fc; --accent:#0b57d0; --chip:#e8f0fe;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --panel:#1b1f24; --ink:#e8eaed; --ink2:#9aa0a6; --line:#2c3138;
    --hov:#22272e; --unreadbg:#1b1f24; --readbg:#171b20; --accent:#8ab4f8; --chip:#233042;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --panel:#1b1f24; --ink:#e8eaed; --ink2:#9aa0a6; --line:#2c3138;
  --hov:#22272e; --unreadbg:#1b1f24; --readbg:#171b20; --accent:#8ab4f8; --chip:#233042;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
.app{display:flex;flex-direction:column;height:100%;}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--bg);}
.burger{width:20px;display:flex;flex-direction:column;gap:4px;cursor:default;}
.burger span{height:2px;background:var(--ink2);border-radius:2px;}
.brand{display:flex;align-items:center;gap:8px;font-size:20px;color:var(--ink2);}
.brand b{color:var(--ink);font-weight:500;}
.search{flex:1;max-width:640px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:9px 18px;color:var(--ink2);}
.acct{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:13px;}
.acct .av{width:32px;height:32px;border-radius:50%;background:#b03e1a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;}
.main{flex:1;display:flex;min-height:0;}
nav{width:216px;padding:12px 8px 12px 12px;flex-shrink:0;}
.compose{display:inline-flex;align-items:center;gap:10px;background:var(--chip);color:var(--ink);border-radius:14px;padding:12px 20px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.12);margin-bottom:14px;}
.nav-item{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;border-radius:0 16px 16px 0;color:var(--ink);cursor:default;font-size:13.5px;}
.nav-item.active{background:#d3e3fd;font-weight:700;color:#001d35;}
:root[data-theme="dark"] .nav-item.active{background:#3c4859;color:#e8eaed;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav-item.active{background:#3c4859;color:#e8eaed;}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .row.selected{background:#31435e;}}
.nav-item .n{font-size:12px;color:inherit;}
.panel{flex:1;background:var(--panel);border-radius:16px;margin:0 12px 12px 0;display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid var(--line);}
.toolbar{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);color:var(--ink2);font-size:12.5px;}
.toolbar .cb{width:16px;height:16px;border:2px solid var(--ink2);border-radius:3px;}
.count{margin-left:auto;}
.list{flex:1;overflow-y:auto;}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--unreadbg);}
.row.read{background:var(--readbg);}
.row:hover{box-shadow:inset 0 0 0 999px rgba(0,0,0,.02);}
.row .cb{width:16px;height:16px;border:2px solid var(--line);border-radius:3px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.row .cb.on{background:var(--accent);border-color:var(--accent);}
.row .cb.on::after{content:"\2713";color:#fff;font-size:12px;line-height:1;}
.row.selected{background:#c2dbff;}
:root[data-theme="dark"] .row.selected{background:#31435e;}
.row .star{color:var(--line);font-size:16px;flex-shrink:0;}
.row .who{width:190px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;}
.row.read .who{font-weight:400;color:var(--ink2);}
.row .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);}
.row .txt b{color:var(--ink);font-weight:700;}
.row.read .txt b{font-weight:400;color:var(--ink2);}
.row .when{flex-shrink:0;font-size:12px;font-weight:700;color:var(--ink);}
.row.read .when{font-weight:400;color:var(--ink2);}
.msg{flex:1;overflow-y:auto;padding:22px 28px;display:none;}
.msg .back{display:inline-flex;align-items:center;gap:8px;color:var(--ink2);cursor:pointer;margin-bottom:16px;font-size:13px;}
.msg h1{font-size:21px;font-weight:400;margin-bottom:18px;}
.mhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px;}
.mhead .av{width:40px;height:40px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;font-size:15px;}
.mhead .fr{font-weight:600;}
.mhead .em{color:var(--ink2);font-weight:400;font-size:13px;}
.mhead .to{color:var(--ink2);font-size:12.5px;margin-top:2px;}
.mhead .when{margin-left:auto;color:var(--ink2);font-size:12.5px;white-space:nowrap;}
.mbody{line-height:1.65;max-width:760px;color:var(--ink);}
.mbody p{margin:0 0 14px;}
.mbody .sig{color:var(--ink2);margin-top:18px;border-top:1px solid var(--line);padding-top:12px;font-size:13px;line-height:1.5;}
.mbody .fakebtn{display:inline-block;background:#0070ba;color:#fff;padding:10px 26px;border-radius:22px;font-weight:600;margin:8px 0;}
.mbody .fakebtn.meta{background:#0866ff;border-radius:8px;}
.mbody .notice{border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:10px 0;}
.mbody .fineprint{color:var(--ink2);font-size:11.5px;margin-top:16px;}
.mbody .vhead{color:#fff;padding:14px 18px;border-radius:8px 8px 0 0;font-weight:700;font-size:15px;letter-spacing:.3px;margin:0 0 0;}
.mbody .vwrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:4px 0 14px;}
.mbody .vwrap .vin{padding:16px 18px;}
.mbody .vwrap .vin p:last-child{margin-bottom:0;}
.mbody .nlbtn{display:inline-block;color:#fff;padding:10px 22px;border-radius:6px;font-weight:600;margin:6px 0;}
.mbody .hubsig{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);margin-top:18px;padding-top:14px;}
.mbody .hubsig img{width:44px;height:44px;border-radius:50%;flex-shrink:0;}
.mbody .hubsig .nm{font-weight:700;color:var(--ink);font-size:13.5px;}
.mbody .hubsig .tt{color:var(--ink2);font-size:12.5px;}
.mbody .hubsig .org{color:#f26722;font-size:12.5px;font-weight:600;}
.mbody .psig{color:var(--ink2);margin-top:18px;font-size:13px;line-height:1.55;border-top:1px solid var(--line);padding-top:12px;}
.mbody .psig b{color:var(--ink);}
.mbody table{border-collapse:collapse;margin:10px 0;}
.mbody td{border:1px solid var(--line);padding:6px 12px;font-size:13px;}
.search input{border:none;outline:none;background:transparent;color:var(--ink);font-size:14px;width:100%;font-family:inherit;}
.search input::placeholder{color:var(--ink2);}
.burger{cursor:pointer;padding:6px;margin:-6px;}
.nav-item{cursor:pointer;}
body.navhidden nav{display:none;}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:13.5px;padding:40px;text-align:center;}
.composer{position:fixed;right:24px;bottom:0;width:480px;max-width:92vw;background:var(--panel);border:1px solid var(--line);border-radius:10px 10px 0 0;box-shadow:0 8px 28px rgba(0,0,0,.28);display:none;flex-direction:column;z-index:50;}
.composer.open{display:flex;}
.composer .chead{background:#404346;color:#fff;padding:10px 16px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;}
.composer .chead .x{cursor:pointer;padding:0 4px;}
.composer input,.composer textarea{border:none;outline:none;background:transparent;color:var(--ink);font-family:inherit;font-size:13.5px;padding:10px 16px;border-bottom:1px solid var(--line);}
.composer textarea{height:220px;resize:none;border-bottom:none;line-height:1.5;}
.composer .cfoot{padding:10px 16px;display:flex;align-items:center;}
.composer .send{background:var(--accent);color:#fff;border:none;border-radius:18px;padding:9px 24px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:inherit;}
.snackbar{position:fixed;left:24px;bottom:24px;background:#333;color:#fff;padding:12px 20px;border-radius:8px;font-size:13.5px;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;z-index:60;pointer-events:none;}
.snackbar.show{opacity:1;}
.attwrap{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.attchip{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:7px 14px 7px 7px;background:#fff;}
.attic{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;letter-spacing:.3px;flex-shrink:0;}
.attmeta{min-width:0;}
.attn{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.attsz{font-size:11px;color:var(--ink2);}
.msgtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.msgtop .back{margin-bottom:0;}
.mnav{display:flex;align-items:center;gap:2px;color:var(--ink2);}
.mnav .pos{font-size:12.5px;margin-right:8px;}
.arr{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;user-select:none;}
.arr:hover{background:var(--hov);}
.arr.off{opacity:.3;cursor:default;}
.arr.off:hover{background:none;}
@media (max-width:760px){
  nav{display:none;}
  .row .who{width:34vw;}
  .panel{margin:0 0 8px;}
  .msg{padding:16px;}
}
</style>
</head>

{id:1,from:"Marcus Webb",email:"marcus@thehubfitness.com",when:"8:58 AM",subject:"Staffing for Paramus opening",body:`<p>Nathan,</p><p>We are down to 2 finalists for the Paramus GM role and I need your call this week so we can extend an offer before the opening.</p><p><b>Renee Fischer:</b> 8 years running a big-box gym in Hackensack. Knows the NJ market, strong on operations and compliance. Less experience building a team from zero.</p><p><b>Devon Price:</b> Assistant GM at our Scottsdale location for 3 years. Knows our systems and culture inside out, hungry for the step up. Has never opened a location and would be relocating.</p><p>My lean is Devon for culture and systems, but Renee is the safer local pick. Both are holding other offers, so the sooner the better.</p><p>Marcus</p>${hubSig("Marcus Webb","Operations Manager")}`},

{id:3,from:"Life Fitness Commercial",email:"accounts@lifefitness.com",when:"8:27 AM",subject:"Invoice #LF-88243 - Annual service contract renewal",body:`<div class="vwrap"><div class="vhead" style="background:#c8102e">LIFE FITNESS <span style="font-weight:400;font-size:12px;opacity:.85">| Commercial</span></div><div class="vin"><p>Dear Customer,</p><p>Please find below the renewal invoice for your commercial service agreement.</p><table><tr><td>Account</td><td>The HUB Fitness Center (15 locations)</td></tr><tr><td>Contract</td><td>Annual full-service agreement, cardio equipment</td></tr><tr><td>Invoice #</td><td>LF-88243</td></tr><tr><td><b>Amount due</b></td><td><b>$4,850.00</b></td></tr><tr><td>Terms</td><td>Net 30</td></tr></table><p>Payment can be made through your account portal. Questions about this invoice can be directed to this address.</p><p style="color:var(--ink2);font-size:12px;margin-bottom:0">Life Fitness Commercial Accounts Receivable</p></div></div>${att([["LF-88243_renewal_invoice.pdf","#d93025","96 KB"]])}`},
{id:4,from:"Kayla Torres",email:"kayla@thehubmesa.com",when:"8:12 AM",subject:"Frustrated - POS system down 3 times this week",body:`<p>Nathan,</p><p>I want to start by saying the new class schedule rollout went well and members have been giving good feedback on the updated formats. The morning slots are filling up faster than the old schedule ever did, and the trainers have adjusted quickly.</p><p>That said, I have to be honest: I am beyond frustrated with the POS system. It has gone down 3 separate times this week. Each outage means we cannot process day passes, retail, or new sign-ups at the desk.</p><p>The part that really hurts: Friday is our biggest walk-in day, and the system was down for almost 2 hours right when the after-work rush hit. We lost at least a dozen day-pass sales and had to hand-write 2 new memberships and enter them later. My front desk staff are improvising and it looks unprofessional.</p><p>I know support tickets exist for this, but nothing has changed. Can someone above my level get the vendor to take this seriously?</p><p>Kayla</p>${hubSig("Kayla Torres","Franchise Owner","The HUB Mesa")}`},
{id:5,from:"PayPal",email:"service@paypa1.com",when:"7:55 AM",subject:"Your account access has been limited",body:`<div class="vwrap"><div class="vhead" style="background:#003087"><i>Pay</i><i style="color:#8ac4ee">Pal</i></div><div class="vin"><p>Dear Customer,</p><p>We noticed unusual activity in your account and have temporarily limited certain features. To restore full access, you will need to confirm your identity and review recent transactions.</p><p>Failure to confirm your information within 48 hours may result in permanent limitation of your account.</p><p style="text-align:center"><span class="fakebtn">Confirm Your Information</span></p><p class="fineprint" style="margin-bottom:0">This email was sent to you as part of our security measures. PayPal is committed to keeping your account safe. Copyright &copy; PayPal Inc. All rights reserved.</p></div></div>${att([["Account_Verification_Form.html","#e8710a","41 KB"]])}`},
{id:6,from:"Alexa Byrne",email:"alexa@thehubfitness.com",when:"7:46 AM",subject:"Corporate membership inquiry - Honeywell Phoenix",body:`<p>Nathan,</p><p>The HR benefits lead at Honeywell's Phoenix campus reached out. They want a quote for corporate memberships covering up to 200 employees across our Phoenix and Tempe locations, ideally launching next quarter.</p><p>This would be our largest corporate account by far. Before I build the proposal, what discount range are you comfortable with at that volume? Our current corporate rate card tops out at 50 employees, so this needs your call.</p><p>They asked for a proposal within 2 weeks. I can have it drafted in 2 days once I have the pricing guardrails.</p><p>Alexa</p>${hubSig("Alexa Byrne","Membership Sales Lead")}`},

{id:9,from:"Priya Raman",email:"praman.fit@gmail.com",when:"7:02 AM",subject:"Following up - multi-unit terms",body:`<p>Hi Nathan,</p><p>Great talking last week. As I mentioned, before we sit down at the expo I would like to review your multi-unit terms: development schedule, per-unit fees, and territory protection. With my 6 smoothie units I learned that the economics of unit 3 onward are where these deals are won or lost, so I want to come prepared with real questions.</p><p>If your team can send the standard multi-unit agreement or a summary ahead of the show, our conversation will be much more productive. I am flexible both days.</p><p>Best,</p><div class="psig"><b>Priya Raman</b><br>Owner &amp; Operator | RGH Franchise Holdings<br>(973) 555-0182</div>`},
{id:10,from:"Membership Team",email:"members@thehubfitness.com",when:"6:45 AM",subject:"Fwd: Refund request - duplicate charge",body:`<p>Forwarding from the shared inbox. Member Alicia Grant (Tempe) was charged twice for her monthly membership on the 1st: $89 posted 2 times, she sent screenshots of both charges and they check out against our records.</p><p>She is asking for the duplicate to be refunded to her card. Standard duplicate-charge refund, $89. Can we process?</p>${hubSig("Membership Team","Shared Inbox")}`},

in"><p>Hi Nathan,</p><p>I noticed The HUB Fitness Center runs on Mindbody. Operators who switch to WellnessLiving typically save 30% on software costs while getting faster support response times, and right now we are offering free data migration for multi-location businesses.</p><p>Worth a 15-minute demo? I have slots open this week and next.</p><div class="psig"><b>Jordan Reyes</b><br>Account Executive | WellnessLiving<br><span style="color:#2ba84a;font-weight:600">wellnessliving.com</span></div></div></div>`},
{id:13,from:"Denise Alvarado",email:"dalvarado@franchiselawgrp.com",when:"Sun 9:41 PM",subject:"FDD amendment - signature needed by end of month",body:`<p>Nathan,</p><p>The amended Franchise Disclosure Document reflecting the New Jersey registration is ready for your signature. I need it executed within the next 3 weeks so the state filing clears before the expo. Without the executed amendment, you cannot legally offer or discuss franchise terms with New Jersey prospects, including at the show itself.</p><p>The signature packet is in your portal. It should take you 15 minutes. Flag anything that reads differently from what we discussed and I will walk you through it.</p><div class="psig"><b>Denise Alvarado, Esq.</b><br>Partner | Franchise Law Group LLP<br>Direct (212) 555-0148<br><span style="font-size:11px">This message may contain privileged and confidential information intended only for the addressee.</span></div>`},
{id:14,from:"Jenna Marsh",email:"jenna@jmarshfit.com",when:"Sun 8:15 PM",subject:"Collab idea before the expo!!",body:`<p>Hi Nathan!!</p><p>SO excited you guys are doing the franchise expo. Idea: what if I come by the booth and film a day-in-the-life piece? My audience is exactly the demographic that joins gyms like yours, and expo content performs really well for me.</p><p>Happy to do it as part of the bigger conversation about the franchise fee arrangement we talked about. This kind of exposure is usually a paid package for me, so I think it balances out nicely for both sides.</p><p>Let me know! Would need to lock my travel soon.</p><p>Jenna</p>`},
{id:15,from:"Monica Reyes",email:"monica@thehubgilbert.com",when:"Sun 6:03 PM",subject:"Is Chandler allowed to run their own influencer events?",body:`<p>Nathan,</p><p>I want to flag something before it turns into a bigger issue. A member showed me an Instagram post this weekend: Chandler has been running its own ticketed training events with a local sports influencer, under their own flyers and their own branding on top of ours. From the post it looks like this was at least the second one.</p><p>When I signed on, I understood that events and partnerships like this go through corporate before anything is announced. I have stayed inside those lines, including passing on a partnership earlier this year because I did not want to step outside the brand guidelines. If Chandler got approval for this, fine, but then I would like the same option. If they did not, then some of us are following the playbook while others freelance with the brand, and that is not a great look for the rest of us.</p><p>Can you clarify what the actual policy is? Happy to get on a call this week.</p><p>Monica</p>${hubSig("Monica Reyes","Franchise Owner","The HUB Gilbert")}`},
{id:16,from:"Meta Business Suite",email:"no-reply@business-meta-support.com",when:"Sun 4:22 PM",subject:"Pending admin request awaiting your approval",body:`<div class="vwrap"><div class="vhead" style="background:#0866ff">&#8734; Meta <span style="font-weight:400;font-size:12px;opacity:.9">Business Suite</span></div><div class="vin"><p>You have 1 pending admin request for your business portfolio <b>The HUB Fitness</b>.</p><p>A user has requested admin access to your Page and ad account. If this request is not reviewed within 24 hours, it may be automatically processed according to your portfolio settings.</p><p style="text-align:center"><span class="fakebtn meta">Review Request</span></p><p class="fineprint" style="margin-bottom:0">This message was sent to the account administrator. Meta Platforms, Inc.</p></div></div>`},
{id:17,from:"Sarah Kim",email:"sarahkim.az@gmail.com",when:"Sun 2:47 PM",subject:"My son slipped near the pool area",body:`<p>Hello,</p><p>I wanted to let you know that my son (he is 9) slipped on the wet tile near the pool entrance at your Tempe location yesterday afternoon. He is okay, a scraped elbow and a bit shaken, but he hit the ground pretty hard and it scared both of us.</p><p>A staff member helped us right away and was very kind, but I noticed there was no wet floor sign out and the mat by the pool door was bunched up in a corner. I am not looking to make a big thing of this, I just think you should know before a smaller kid or an older member has a worse fall in the same spot.</p><p>Sarah Kim</p>`},
{id:18,from:"Dan Martell",email:"team@danmartell.com",when:"Sun 1:10 PM",subject:"The inbox system from Buy Back Your Time",body:`<div class="vwrap"><div class="vhead" style="background:#0a0a0a;letter-spacing:1px">&#9650; DAN MARTELL <span style="font-weight:400;font-size:12px;opacity:.75;letter-spacing:.3px">| THE MARTELL METHOD</span></div><div class="vin"><p>Most executives do not have an email problem. They have a decision problem that lives in their inbox.</p><p>In Buy Back Your Time I laid out the labeling system my EA uses to run my inbox so that I only ever touch what actually needs me: a small set of labels, clear rules for what gets each one, and an end-of-day summary that takes me 3 minutes to read.</p><p>This week I recorded a full walkthrough of the system, including the exact labels and the handoff process with my assistant:</p><p><a class="nlbtn" href="https://www.youtube.com/watch?v=6q9AT_A2ydA" target="_blank" rel="noopener" style="background:#38b6ff;text-decoration:none">&#9654;&nbsp; Watch: How my EA manages my inbox</a></p><p>Buy back your time,<br>Dan</p><p class="fineprint" style="margin-bottom:0">You are receiving this because you subscribed at danmartell.com. Unsubscribe</p></div></div>`},
{id:19,from:"Tom Aguila",email:"tom@aguilacommercial.com",when:"Sun 11:38 AM",subject:"Site opportunity - Jersey City, 12,400 sq ft",body:`<p>Nathan,</p><p>A space just came available that fits the profile you described: 12,400 sq ft ground-floor retail in Jersey City, ceiling height and floor load work for fitness use, dedicated parking, and the landlord is open to a build-out allowance for the right tenant.</p><p>Spaces like this in that submarket do not sit. I can hold a walkthrough slot for you or someone from your team this week. After that, it goes to the open market.</p><div class="psig"><b>Tom Aguila</b><br>Principal Broker | Aguila Commercial Realty<br>Office (201) 555-0171 | Mobile (201) 555-0144<br><span style="color:#8a6d1d;font-weight:600">aguilacommercial.com</span></div>`},
{id:20,from:"Greg Moretti",email:"gmoretti1958@aol.com",when:"Sun 10:05 AM",subject:"hello",body:`<p>hi, i was in arizona visiting my daughter last month and she took me to your gym in scottsdale. very impressed with the place, the staff, everything spotless.</p><p>my son and i have been looking at businesses to invest in together in new jersey where we live. do you franchise? what does something like this cost to open. we have owned rental properties for 30 years and sold a distribution business in 2023 so we are serious, just dont know the gym industry.</p><p>you can call me anytime 973 555 0117</p><p>greg moretti</p>`},
{id:21,from:"Luis Herrera",email:"luis@thehubtucson.com",when:"Sun 8:52 AM",subject:"Thank you + quick win",body:`<p>Nathan,</p><p>Quick one: we just closed our best month for new memberships since opening. 118 new sign-ups, and the referral push your team suggested last quarter drove almost a third of them.</p><p>Thank you for the support on the marketing side. The playbook works. Happy to share what we did with the other locations if useful.</p><p>Luis</p>${hubSig("Luis Herrera","Franchise Owner","The HUB Tucson")}`},
{id:22,from:"Nathan Cook",email:"nathan@thehubfitness.com",when:"Sat 11:47 PM",subject:"Fwd: ideas",body:`<p>---------- Forwarded message ----------</p><p>ideas, don't lose:</p><p>- 45 min strength class format, test at scottsdale first?<br>- podcast w/ franchisees as guests. "built with the hub" or something<br>- lobby at tempe needs repaint, looked tired today<br>- ask marcus about towel service costs<br>- book about franchise systems the guy at rotary mentioned. find it</p>`},

{id:24,from:"Robert Kessler",email:"rkessler@kesslerventures.com",when:"Sat 7:14 PM",subject:"Confirming Saturday at the expo",body:`<p>Nathan,</p><p>Confirming I will be at the franchise expo Saturday morning only; I fly out that afternoon. You mentioned your team would have a private room at the show. Send me a time and where to check in and I will be there.</p><p>Since Scottsdale I have narrowed my focus to Connecticut and Westchester. I want to talk real territory numbers, not the brochure version. If your ops person can join for part of it, even better.</p><p>Rob</p>`},

{id:26,from:"Alexa Byrne",email:"alexa@thehubfitness.com",when:"Sat 3:28 PM",subject:"PTO request",body:`<p>Hi Nathan,</p><p>I would like to request PTO for the full week right after the expo, Monday through Friday. My sister is getting married that weekend and the family is gathering early.</p><p>I will have the corporate membership proposal and all expo follow-ups queued before I leave, and I can be reachable for anything urgent from the Honeywell side.</p>${hubSig("Alexa Byrne","Membership Sales Lead")}`},
{id:27,from:"Dana Whitfield",email:"dana@thehubfitness-tucson2.com",when:"Sat 1:55 PM",subject:"Question about holiday hours policy",body:`<p>Hi Nathan,</p><p>Quick policy question ahead of the upcoming Memorial Day weekend: are franchised locations allowed to set our own holiday hours, or does HQ define them? Last year we ran reduced hours and a few members complained that the Scottsdale location was open longer.</p><p>Want to get it right this year and put it in our staff schedule early.</p>${hubSig("Dana Whitfield","Franchise Owner","The HUB Tucson II")}`},
{id:28,from:"Anthony Russo",email:"arusso.fitequip@gmail.com",when:"Sat 11:20 AM",subject:"Great meeting you at the trade show last month",body:`<p>Nathan!</p><p>Great meeting you at the trade show last month, really enjoyed our chat about the expansion. As promised, following up about refurbished commercial equipment. We supply certified refurb cardio and strength lines at 40 to 50% below new, with warranties.</p><p>For the new location: how many cardio units are you planning for Paramus? And who on your operations side should I coordinate with for a visit before the opening? If you send me your current equipment inventory I can put together trade-in numbers too.</p><div class="psig"><b>Anthony Russo</b><br>Commercial Fitness Equipment | Certified Refurb Specialist<br>(551) 555-0189</div>`},

{id:33,from:"Karen Dellinger",email:"karen.dellinger@gmail.com",when:"Fri 6:38 PM",subject:"Cancellation",body:`<p>Hello,</p><p>I need to cancel my membership. I have been a member at the Scottsdale location for 6 years and it has honestly been great, the 6 AM crew feels like family at this point. This was not an easy decision.</p><p>We are moving at the end of the month because of my husband's job. The new house is actually only a couple of blocks from your Tempe location, but my membership and all my history are tied to Scottsdale, so I assume I have to close it out. Please let me know what you need from me to process the cancellation.</p><div class="psig"><b>Karen Dellinger</b><br>(480) 555-0129</div>`},
{id:34,from:"Mindbody",email:"billing@mindbodyonline.com",when:"Fri 6:02 PM",subject:"Your subscription renewal",body:`<div class="vwrap"><div class="vhead" style="background:#0e8a72">mindbody<span style="font-weight:400;font-size:12px;opacity:.9">&nbsp; business</span></div><div class="vin"><p>Hello,</p><p>This is a notice that your Mindbody subscription for The HUB Fitness Center (15 sites) renews next month at your current plan and rate. No action is needed; your payment method on file will be charged automatically.</p><p style="margin-bottom:0">A detailed renewal summary is available in your admin portal.</p></div></div>`},
{id:35,from:"Marcus Webb",email:"marcus@thehubfitness.com",when:"Fri 5:33 PM",subject:"SOP question from new Chandler manager",body:`<p>Nathan,</p><p>The new manager at Chandler asked me today how she should report a damaged machine, and honestly I did not have a clean answer for her. Everyone does it differently: some text you, some call the manufacturer directly, Tucson uses that repair shop.</p><p>Did we ever write down an actual process for this? If it exists I cannot find it, and if it does not, we probably need one before Paramus opens and a brand new team starts improvising too.</p><p>Marcus</p>${hubSig("Marcus Webb","Operations Manager")}`},
{id:36,from:"Marcus Webb",email:"marcus@thehubfitness.com",when:"Fri 4:51 PM",subject:"Equipment delivery delayed - Paramus",body:`<p>Nathan,</p><p>Heads up: Iron Strength called this afternoon about a warehouse allocation problem with our Paramus order. The rep I spoke to said part of the order could slip past the opening.</p><p>If that holds, my plan B is to pull the backup strength equipment from Scottsdale's storage for opening week and swap it out when the real order lands. Not ideal, but the floor would not look empty on day 1.</p><p>Want me to activate that, or wait for their formal update?</p><p>Marcus</p>${hubSig("Marcus Webb","Operations Manager")}`},
{id:37,from:"Alexa Byrne",email:"alexa@thehubfitness.com",when:"Fri 4:37 PM",subject:"Membership numbers - monthly report",body:`<p>Nathan,</p><p>Monthly membership summary attached. Headline numbers: total active members up 4.2% across all locations, with Tucson leading growth for the second month running. Churn held steady at 2.1%. Corporate memberships flat, though that may change soon (separate email coming on that).</p><p>No action needed, full breakdown in the attachment.</p><p>Alexa</p>${hubSig("Alexa Byrne","Membership Sales Lead")}${att([["membership_summary.xlsx","#188038","44 KB"]])}`},

{id:39,from:"Derek Shaw",email:"derek@thehubfitness.com",when:"Fri 3:50 PM",subject:"Utilities cost spike - Scottsdale",body:`<p>Nathan,</p><p>Flagging something from this month's close: Scottsdale's electric bill came in 40% higher than the same month last year. Usage is up some (we extended hours), but not 40%. Comparison attached.</p><p>Do you want me to dig in now (rate change? HVAC issue? meter?), or watch it another month before spending time on it?</p>${hubSig("Derek Shaw","General Manager","The HUB Scottsdale")}${att([["utilities_comparison.pdf","#d93025","128 KB"]])}`},
{id:40,from:"FitBiz Weekly",email:"digest@fitbizweekly.com",when:"Fri 3:31 PM",subject:"5 trends reshaping boutique fitness",body:`<div class="vwrap"><div class="vhead" style="background:#5a2ca0">FitBiz <span style="font-weight:400">Weekly</span></div><div class="vin"><p>This week in FitBiz:</p><p>1. Recovery zones are the new juice bar. 2. Hybrid memberships keep outperforming. 3. Why strength training demand keeps climbing with every demographic. 4. The staffing squeeze: what operators are paying now. 5. Franchising vs. corporate growth: the math in this market.</p><p><span class="nlbtn" style="background:#5a2ca0">Read this week's issue</span></p><p class="fineprint" style="margin-bottom:0">FitBiz Weekly. Unsubscribe | Preferences</p></div></div>`}
];
const COLORS=["#b03e1a","#3574c4","#564f58","#9b432f","#bc5f24","#1a73a8","#5f7d4f","#7b5aa6","#a8543c","#456f8c"];
function av(name){let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))%COLORS.length;return COLORS[h];}
const read=new Set();
let currentView="Inbox";
let query="";

const list=document.getElementById("list"),msg=document.getElementById("msg");
let lastShown=EMAILS,currentOpen=null;
function matches(e,q){
  if(!q)return true;
  q=q.toLowerCase();
  const plain=e.body.replace(/<[^>]+>/g," ").toLowerCase();
  return e.from.toLowerCase().includes(q)||e.email.toLowerCase().includes(q)||e.subject.toLowerCase().includes(q)||plain.includes(q);
}
function renderList(){
  list.innerHTML="";
  msg.style.display="none";
  list.style.display="block";
  if(currentView!=="Inbox"){
    const msgs={Starred:"No starred messages.",Snoozed:"No snoozed messages.",Sent:"No sent messages.",Drafts:"No drafts."};
    list.innerHTML='<div class="empty">'+msgs[currentView]+'</div>';
    document.getElementById("countLabel").textContent="";
    updateUnread();
    return;
  }
  const shown=EMAILS.filter(e=>matches(e,query));
  lastShown=shown;
  currentOpen=null;
  document.getElementById("countLabel").textContent=shown.length?("1\u2013"+shown.length+" of "+shown.length):"";
  if(!shown.length){
    list.innerHTML='<div class="empty">No messages matched your search.</div>';
    updateUnread();
    return;
  }
  shown.forEach(e=>{
    const r=document.createElement("div");
    r.className="row"+(read.has(e.id)?" read":"");
    r.innerHTML=`<div class="cb"></div><div class="star">&#9734;</div><div class="who"></div><div class="txt"><b></b><span class="pv"></span></div><div class="when"></div>`;
    r.querySelector(".who").textContent=e.from;
    r.querySelector(".txt b").textContent=e.subject;
    const plain=e.body.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
    r.querySelector(".pv").textContent=" \u2014 "+plain.slice(0,110);
    r.querySelector(".when").textContent=e.when;
    r.onclick=()=>openMsg(e);
    const cb=r.querySelector(".cb");
    cb.onclick=(ev)=>{ev.stopPropagation();cb.classList.toggle("on");r.classList.toggle("selected");};
    list.appendChild(r);
  });
  updateUnread();
}
function updateUnread(){
  const unread=EMAILS.length-read.size;
  document.getElementById("inboxCount").textContent=unread>0?unread:"";
}
function openMsg(e){
  read.add(e.id);
  list.style.display="none";
  msg.style.display="block";
  currentOpen=e;
  const seq=lastShown.length?lastShown:EMAILS;
  const idx=seq.findIndex(x=>x.id===e.id);
  msg.innerHTML=`<div class="msgtop"><div class="back">&larr; Back to inbox</div><div class="mnav"><span class="pos">${idx+1} of ${seq.length}</span><span class="arr${idx<=0?" off":""}" id="prevArrow" title="Newer">&#8249;</span><span class="arr${idx>=seq.length-1?" off":""}" id="nextArrow" title="Older">&#8250;</span></div></div>
  <h1></h1>
  <div class="mhead">
    <div class="av" style="background:${av(e.from)}">${e.from.trim()[0]}</div>
    <div><span class="fr"></span> <span class="em"></span><div class="to">to me</div></div>
    <div class="when"></div>
  </div>
  <div class="mbody">${e.body}</div>`;
  msg.querySelector("h1").textContent=e.subject;
  msg.querySelector(".fr").textContent=e.from;
  msg.querySelector(".em").textContent="<"+e.email+">";
  msg.querySelector(".mhead .when").textContent=e.when;
  msg.querySelector(".back").onclick=()=>{renderList();window.scrollTo(0,0);};
  msg.querySelector("#prevArrow").onclick=()=>{if(idx>0)openMsg(seq[idx-1]);};
  msg.querySelector("#nextArrow").onclick=()=>{if(idx<seq.length-1)openMsg(seq[idx+1]);};
  msg.scrollTop=0;
}
document.querySelectorAll(".nav-item").forEach(item=>{
  item.onclick=()=>{
    document.querySelectorAll(".nav-item").forEach(i=>i.classList.remove("active"));
    item.classList.add("active");
    currentView=item.dataset.view;
    renderList();
  };
});
document.getElementById("searchInput").addEventListener("input",ev=>{
  query=ev.target.value.trim();
  if(currentView!=="Inbox"){
    currentView="Inbox";
    document.querySelectorAll(".nav-item").forEach(i=>i.classList.toggle("active",i.dataset.view==="Inbox"));
  }
  renderList();
});
document.getElementById("burger").onclick=()=>document.body.classList.toggle("navhidden");
const composer=document.getElementById("composer");
document.getElementById("composeBtn").onclick=()=>composer.classList.add("open");
document.getElementById("composerClose").onclick=()=>composer.classList.remove("open");
document.getElementById("composerSend").onclick=()=>{
  composer.classList.remove("open");
  composer.querySelectorAll("input,textarea").forEach(f=>f.value="");
  const sb=document.getElementById("snackbar");
  sb.classList.add("show");
  setTimeout(()=>sb.classList.remove("show"),2500);
};
document.addEventListener("keydown",ev=>{
  if(msg.style.display!=="block"||!currentOpen)return;
  const t=ev.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA")return;
  const seq=lastShown.length?lastShown:EMAILS;
  const idx=seq.findIndex(x=>x.id===currentOpen.id);
  if(ev.key==="ArrowLeft"&&idx>0)openMsg(seq[idx-1]);
  if(ev.key==="ArrowRight"&&idx<seq.length-1)openMsg(seq[idx+1]);
});
renderList();
</script>
</body>
</html>
